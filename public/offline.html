<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#6f5bd3" />
  <title>نامی آفلاین است</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7fb;color:#292534;font-family:Tahoma,sans-serif;padding:24px;box-sizing:border-box}.card{max-width:380px;padding:30px;border:1px solid #ebe7f4;border-radius:28px;background:#fff;text-align:center;box-shadow:0 20px 55px rgba(62,47,92,.1)}.mark{width:68px;height:68px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#eeeafd;color:#6f5bd3;font-size:30px}h1{font-size:23px;margin:18px 0 8px}p{color:#777281;line-height:1.9;font-size:14px}button{width:100%;min-height:48px;border:0;border-radius:15px;background:#6f5bd3;color:#fff;font-weight:700}
  </style>
</head>
<body><main class="card"><div class="mark">♡</div><h1>فعلاً آفلاینی</h1><p>وقتی اینترنت برگرده، نامی دوباره اطلاعات تازه‌تون رو میاره. اطلاعات خصوصی مثل دفتر، چرخه و سیگنال‌ها روی این صفحه ذخیره نمی‌شن.</p><button onclick="location.reload()">تلاش دوباره</button></main></body>
</html>
