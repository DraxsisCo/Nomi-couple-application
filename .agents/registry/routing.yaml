version: 1

risk:
  low:
    required_roles: [implementer, reviewer]
  medium:
    required_roles: [implementer, test-engineer, reviewer]
  high:
    required_roles: [architect, implementer, test-engineer, reviewer, tech-lead]
  critical:
    required_roles: [orchestrator, architect, implementer, qa, reviewer, tech-lead, human-approval]

triggers:
  authentication:
    add: [security-engineer]
  authorization:
    add: [security-engineer, appsec-reviewer]
  secrets:
    add: [security-engineer]
  database_schema:
    add: [database-engineer]
  migration:
    add: [database-engineer, database-ops]
  ci_cd:
    add: [devops-engineer]
  production_reliability:
    add: [sre-engineer]
  performance:
    add: [performance-engineer]
  accessibility:
    add: [accessibility-reviewer]
  external_integration:
    add: [integration-engineer]
